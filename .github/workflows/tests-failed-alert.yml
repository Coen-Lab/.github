# Marks a main commit whose tests failed with an error annotation on the run. Machines install from
# main, and changes reach main through pull requests by convention only (the
# ruleset lets admins push), so a red main is live on the next launch.
# No commit comment and no email (Pip, 14 Nov 2026): a comment emails the
# commit's author even without a mention, and Pip authors nearly every commit.
#
# Each repository keeps its own tests job (runners and toolchains differ) and
# calls this after it:
#
#   alert:
#     needs: tests
#     if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
#     uses: Coen-Lab/.github/.github/workflows/tests-failed-alert.yml@main
#     with:
#       result: ${{ needs.tests.result }}
#     permissions:
#       contents: write
#
# A change here reaches every repository that calls it on its next push.

name: Tests failed alert

on:
  workflow_call:
    inputs:
      result:
        description: The caller's tests job result (success, failure, cancelled, skipped).
        required: true
        type: string

permissions:
  contents: read

jobs:
  # rig-setup's 5cf359d failed on 19 Oct 2026 and students were told to
  # relaunch for fixes that had not shipped, so a red main is marked on the
  # run's page. Never an issue (ClaudioVisual answers issues and would try to
  # fix the tests) and never a commit comment (it emails Pip). A cancelled
  # run (a newer push queued behind) says nothing.
  alert:
    if: inputs.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark the failing commit
        run: echo "::error title=Tests failed on main::Machines install from main, so $GITHUB_SHA is live on their next launch."
