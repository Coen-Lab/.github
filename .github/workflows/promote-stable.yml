# Fast-forwards `stable` to a master commit whose tests passed, or mentions
# Pip on the commit when they failed. Machines install from `stable`, never
# master, so this is what keeps a push that breaks the tests off them, whoever
# pushed it: admins bypass the master ruleset, so a required check alone gates
# only pull requests.
#
# Each repository keeps its own tests job (runners and toolchains differ) and
# calls this after it:
#
#   stable:
#     needs: tests
#     if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
#     uses: Coen-Lab/.github/.github/workflows/promote-stable.yml@master
#     with:
#       result: ${{ needs.tests.result }}
#     permissions:
#       contents: write
#
# A change here reaches every repository that calls it on its next push.

name: Promote stable

on:
  workflow_call:
    inputs:
      result:
        description: The caller's tests job result (success, failure, cancelled, skipped).
        required: true
        type: string

permissions:
  contents: write

jobs:
  stable:
    if: inputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward stable to the tested commit
        run: |
          if git rev-parse --verify --quiet origin/stable >/dev/null &&
             git merge-base --is-ancestor "$GITHUB_SHA" origin/stable; then
            echo "stable already contains $GITHUB_SHA"
            exit 0
          fi
          # Not --force: a push that is not a fast-forward is refused.
          git push origin "$GITHUB_SHA:refs/heads/stable"

  # A red run on master moves nothing and says nothing: rig-setup's 5cf359d
  # failed on 19 Oct 2026 and `stable` sat a day behind while students were
  # told to relaunch for fixes that had not shipped. So a failure mentions Pip
  # on the commit, which GitHub notifies. A commit comment rather than an
  # issue, because ClaudioVisual answers issues and would try to fix the tests.
  # A cancelled run (a newer push queued behind) says nothing.
  alert:
    if: inputs.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mention Pip on the failing commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="@pipcoen Tests failed on master, so \`stable\` did not move and no machine gets this commit until a later push is green. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
